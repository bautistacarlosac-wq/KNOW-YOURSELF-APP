
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KNOW YOURSELF — Diagnóstico Táctico</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"Space Mono"', 'monospace'],
          },
          colors: {
            black: '#000000',
            white: '#ffffff',
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #000000; color: #ffffff; }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-white selection:text-black font-sans antialiased">

  <header class="border-b border-gray-900 bg-black/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-6 py-6 flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
        <h1 class="font-mono text-xs tracking-[0.2em] text-white uppercase font-bold">Know Yourself / V2.0</h1>
      </div>
      <span class="font-mono text-[10px] text-gray-500 border border-gray-800 px-3 py-1 uppercase tracking-[0.2em]">Sistema Activo</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-16 w-full flex-grow">
    <div class="mb-12 border-b border-gray-900 pb-10">
      <p class="font-mono text-[10px] text-gray-500 uppercase tracking-[0.2em] mb-4">Evaluación de Desempeño</p>
      <h2 class="font-serif text-4xl md:text-5xl text-white tracking-tight leading-tight">Diagnóstico de Hábitos y Control Cognitivo</h2>
    </div>

    <div id="app" class="bg-black border border-gray-800 p-8 md:p-12 min-h-[450px] flex flex-col justify-center">
      <!-- UI inyectada por JS -->
    </div>
  </main>

  <footer class="border-t border-gray-900 py-10 text-gray-500 font-mono text-[10px] uppercase tracking-[0.1em]">
    <div class="max-w-4xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
      <p>© 2026 KNOW YOURSELF — Desarrollado con JS Vainilla</p>
      <div class="flex space-x-6 text-gray-600">
        <span>Arquitectura Asistida por IA</span>
        <span>Despliegue Vercel</span>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
