<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Know Yourself - Autoevaluación & Estatus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">⚡</span>
        <h1 class="font-extrabold text-xl tracking-wider text-amber-500 uppercase">Know Yourself</h1>
      </div>
      <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full font-semibold">Fase de Evaluación v1.0</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto px-6 py-10 w-full flex-grow">
    
    <!-- Intro Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-8 shadow-xl">
      <h2 class="text-2xl font-bold mb-2 text-white">Diagnóstico de Desempeño y Disciplina</h2>
      <p class="text-slate-400 text-sm leading-relaxed">
        Responde con franqueza. Este test evalúa tu nivel actual de ejecución táctica, claridad de propósito y rigor personal. 
      </p>
    </div>

    <!-- Quiz App Container -->
    <div id="app" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
      <!-- Content inserted via JS -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© 2026 Know Yourself App — Construida con arquitectura limpia e IA Copilot</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
